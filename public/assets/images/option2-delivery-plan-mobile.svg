    <g transform="translate(0 38)">
      <g><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#2878bd"/><text x="18" y="28" class="strong tiny">Governance</text><text x="18" y="51" class="tiny muted">11% · On track</text></g>
      <g transform="translate(226)"><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#7f62c5"/><text x="18" y="28" class="strong tiny">Design</text><text x="18" y="51" class="tiny" fill="#a91f35">63% · At risk</text></g>
      <g transform="translate(452)"><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#14946e"/><text x="18" y="28" class="strong tiny">Platform</text><text x="18" y="51" class="tiny muted">14% · On track</text></g>
      <g transform="translate(0 82)"><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#d38b19"/><text x="18" y="28" class="strong tiny">Data</text><text x="18" y="51" class="tiny" fill="#a91f35">25% · At risk</text></g>
      <g transform="translate(226 82)"><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#1696a7"/><text x="18" y="28" class="strong tiny">Integration</text><text x="18" y="51" class="tiny muted">18% · On track</text></g>
      <g transform="translate(452 82)"><rect width="208" height="68" rx="12" fill="#fff" stroke="#d7e2e8"/><rect width="5" height="68" rx="3" fill="#789447"/><text x="18" y="28" class="strong tiny">Adoption</text><text x="18" y="51" class="tiny" fill="#a91f35">4% · At risk</text></g>
    </g>
  </g>
  <g transform="translate(30 474)">
