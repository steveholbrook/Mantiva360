    <g fill="#607486" font-size="13" font-weight="700" text-anchor="middle"><text x="39" y="28">W9</text><text x="112" y="28">W10</text><text x="185" y="28">W11</text><text x="258" y="28">W12</text><text x="331" y="28">W13</text><text x="404" y="28">W14</text><text x="477" y="28">W15</text><text x="550" y="28">W16</text><text x="623" y="28">W17</text></g>
    <g stroke="#e1e8ed"><path d="M73 0v306M146 0v306M219 0v306M292 0v306M365 0v306M438 0v306M511 0v306M584 0v306"/><path d="M0 42h660M0 102h660M0 162h660M0 222h660M0 282h660"/></g>
    <rect x="12" y="54" width="612" height="34" rx="8" fill="#9fc9e9"/><rect x="12" y="54" width="130" height="34" rx="8" fill="#2878bd"/><text x="26" y="76" class="white bar">Project management · 21%</text>
    <rect x="64" y="114" width="310" height="38" rx="8" fill="url(#selected)" stroke="#b51f38" stroke-width="4"/><rect x="82" y="96" width="86" height="23" rx="5" fill="#a91f35"/><text x="125" y="112" class="white caps" text-anchor="middle">OVERDUE</text><text x="83" y="139" class="white bar">Solution Design · 90%</text>
    <rect x="178" y="174" width="418" height="34" rx="8" fill="#c9bfaa"/><rect x="178" y="174" width="134" height="34" rx="8" fill="#9a8c70"/><text x="194" y="196" class="white bar">Cloud platform · 32%</text>
    <rect x="234" y="234" width="300" height="34" rx="8" fill="#bdccd5"/><rect x="234" y="234" width="150" height="34" rx="8" fill="#78909d"/><text x="249" y="256" class="white bar">Data quality · 50%</text>
    <line x1="330" y1="42" x2="330" y2="306" stroke="#1775bd" stroke-width="3"/><rect x="286" y="48" width="88" height="25" rx="5" fill="#1775bd"/><text x="330" y="65" class="white tiny strong" text-anchor="middle">Mantiva360</text>
    <line x1="363" y1="42" x2="363" y2="306" stroke="#db3748" stroke-width="3"/><rect x="374" y="78" width="62" height="25" rx="5" fill="#db3748"/><text x="405" y="95" class="white tiny strong" text-anchor="middle">Today</text>
