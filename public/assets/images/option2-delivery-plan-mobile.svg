  <g transform="translate(30 808)">
    <rect width="660" height="136" rx="16" fill="#fff" stroke="#62cbbd" stroke-width="2"/>
    <circle cx="0" cy="0" r="23" fill="#0c7373"/><text x="0" y="7" class="white strong" font-size="20" text-anchor="middle">1</text>
    <text x="28" y="38" class="strong" font-size="22">Solution Design crossed Today.</text>
    <text x="28" y="70" class="small muted">The plan makes the condition visible before</text><text x="28" y="96" class="small muted">the detailed control explanation.</text>
    <rect x="496" y="102" width="136" height="25" rx="13" fill="#e0f3ef"/><text x="564" y="120" class="tiny strong" fill="#0c7373" text-anchor="middle">Inspect signal →</text>
  </g>
