<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Mantiva360 Delivery Plan mobile promotional interface</title>
  <desc id="desc">A mobile delivery plan view with a highlighted overdue Solution Design activity, today marker and explanation.</desc>
  <defs>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2c"/><stop offset="1" stop-color="#0b304b"/></linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1268b3"/><stop offset="1" stop-color="#188989"/></linearGradient>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#233f55}.small{font-size:18px}.tiny{font-size:15px}.muted{fill:#718396}.strong{font-weight:800}.white{fill:#fff}.bar{font-size:15px;font-weight:750}.caps{font-size:13px;font-weight:900;letter-spacing:1px}</style>
  </defs>
  <rect width="720" height="980" rx="28" fill="#eff5f7"/>
  <rect width="720" height="72" rx="28" fill="url(#nav)"/><rect y="44" width="720" height="28" fill="url(#nav)"/>
  <circle cx="38" cy="36" r="14" fill="none" stroke="#46c7b3" stroke-width="6"/><path d="M38 22a14 14 0 0 1 13 8" fill="none" stroke="#8db7c8" stroke-width="6" stroke-linecap="round"/>
  <text x="66" y="45" class="white strong" font-size="24">Mantiva360</text><circle cx="675" cy="36" r="18" fill="#fff" opacity=".14"/><text x="675" y="42" class="white tiny strong" text-anchor="middle">GR</text>
  <text x="30" y="117" class="strong" font-size="30">Delivery Plan (POAP)</text>
  <text x="30" y="146" class="small muted">Approved baseline and current working plan</text>
