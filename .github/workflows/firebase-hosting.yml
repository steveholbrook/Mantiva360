name: Deploy Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - name: Verify Firebase configuration
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}"
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}"
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          channelId: live
