name: Firebase website preview

on:
  pull_request:
    paths:
      - "public/**"
      - "firebase.json"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/firebase-preview.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - name: Deploy isolated review channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}"
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          expires: 14d
