name: Deploy Firebase Hosting Review

on:
  push:
    branches:
      - review/world-class-executive-confidence-2026-09-17

permissions:
  contents: read

concurrency:
  group: firebase-review-executive-confidence
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Reuse the protected credential scope configured by the existing workflow.
    # The Firebase target below remains an expiring, non-live channel.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - name: Verify Firebase review configuration
        run: |
          test -n "${{ vars.FIREBASE_PROJECT_ID }}"
          test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}"
      - name: Deploy Firebase review channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}"
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          channelId: executive-confidence
          expires: 7d
      - name: Record review destination
        run: |
          {
            echo "### Firebase review channel"
            echo
            echo "URL: ${{ steps.deploy.outputs.details_url }}"
            echo "Expires: ${{ steps.deploy.outputs.expire_time_formatted }}"
          } >> "$GITHUB_STEP_SUMMARY"
