name: Bootstrap keyless Firebase deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm this one-time security migration
        required: true
        type: choice
        options:
          - DO NOT RUN
          - CREATE KEYLESS TRUST

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-wif-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.inputs.confirmation == 'CREATE KEYLESS TRUST' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      PROJECT_NUMBER: "499142789431"
      SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@mantiva360-marketing.iam.gserviceaccount.com
      POOL_ID: github-actions
      PROVIDER_ID: mantiva360-production
      REPOSITORY_ID: "1372855233"
      REPOSITORY_OWNER_ID: "41897146"
    steps:
      - uses: actions/checkout@v4

      - name: Verify bootstrap inputs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "mantiva360-marketing"
          test "$GITHUB_REPOSITORY_ID" = "$REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$REPOSITORY_OWNER_ID"
          test -n "$FIREBASE_SERVICE_ACCOUNT"

      - id: bootstrap-auth
        name: Authenticate with the existing deployment key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANTIVA360 }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Create repository-restricted keyless trust
        run: |
          set -euo pipefail

          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$active_account" = "$SERVICE_ACCOUNT"

          actual_project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          test "$actual_project_number" = "$PROJECT_NUMBER"

          gcloud services enable \
            iamcredentials.googleapis.com \
            sts.googleapis.com \
            --project="$PROJECT_ID" \
            --quiet

          if ! gcloud iam workload-identity-pools describe "$POOL_ID" \
            --project="$PROJECT_ID" \
            --location=global >/dev/null 2>&1; then
            gcloud iam workload-identity-pools create "$POOL_ID" \
              --project="$PROJECT_ID" \
              --location=global \
              --display-name="GitHub Actions" \
              --description="Short-lived GitHub Actions credentials for Mantiva360"
          fi

          attribute_mapping="google.subject=assertion.sub,attribute.repository_id=assertion.repository_id,attribute.repository_owner_id=assertion.repository_owner_id,attribute.ref=assertion.ref,attribute.environment=assertion.environment"
          attribute_condition="assertion.repository_id == '${REPOSITORY_ID}' && assertion.repository_owner_id == '${REPOSITORY_OWNER_ID}' && assertion.ref == 'refs/heads/main' && assertion.environment == 'production'"

          if gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project="$PROJECT_ID" \
            --location=global \
            --workload-identity-pool="$POOL_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools providers update-oidc "$PROVIDER_ID" \
              --project="$PROJECT_ID" \
              --location=global \
              --workload-identity-pool="$POOL_ID" \
              --issuer-uri="https://token.actions.githubusercontent.com" \
              --attribute-mapping="$attribute_mapping" \
              --attribute-condition="$attribute_condition"
          else
            gcloud iam workload-identity-pools providers create-oidc "$PROVIDER_ID" \
              --project="$PROJECT_ID" \
              --location=global \
              --workload-identity-pool="$POOL_ID" \
              --display-name="Mantiva360 production" \
              --issuer-uri="https://token.actions.githubusercontent.com" \
              --attribute-mapping="$attribute_mapping" \
              --attribute-condition="$attribute_condition"
          fi

          principal="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/attribute.repository_id/${REPOSITORY_ID}"
          gcloud iam service-accounts add-iam-policy-binding "$SERVICE_ACCOUNT" \
            --project="$PROJECT_ID" \
            --role=roles/iam.workloadIdentityUser \
            --member="$principal" \
            --quiet

      - name: Remove temporary Owner elevation
        if: always() && steps.bootstrap-auth.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${SERVICE_ACCOUNT}" \
            --role=roles/owner \
            --condition=None \
            --quiet
